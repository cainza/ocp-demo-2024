kind: Deployment
apiVersion: apps/v1
metadata:
  name: kafka-server-ui
spec:
  replicas: 1
  selector:
    matchLabels:
      app: kafka-server-ui
  template:
    metadata:
      creationTimestamp: null
      labels:
        app: kafka-server-ui
    spec:
      containers:
        - resources:
            limits:
              cpu: 500m
              memory: 1Gi
            requests:
              cpu: 500m
              memory: 1Gi
          readinessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 15
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          terminationMessagePath: /dev/termination-log
          name: container
          livenessProbe:
            httpGet:
              path: /actuator/health
              port: 9000
              scheme: HTTP
            initialDelaySeconds: 30
            timeoutSeconds: 1
            periodSeconds: 10
            successThreshold: 1
            failureThreshold: 3
          env:
            - name: KAFKA_BROKERCONNECT
              value: 'brd-dev-kafka-kafka-bootstrap:9092'
            - name: SERVER_SERVLET_CONTEXTPATH
              value: /
          ports:
            - containerPort: 8080
              protocol: TCP
          imagePullPolicy: Always
          terminationMessagePolicy: File
          image: 'obsidiandynamics/kafdrop:latest'
      restartPolicy: Always
      terminationGracePeriodSeconds: 30
      dnsPolicy: ClusterFirst
      securityContext: {}
      schedulerName: default-scheduler
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 25%
      maxSurge: 25%
  revisionHistoryLimit: 10
  progressDeadlineSeconds: 600
---
apiVersion: v1
kind: Service
metadata:
  name: kafka-server-ui
spec:
  selector:
    app: kafka-server-ui
  ports:
    - protocol: TCP
      port: 9000
      targetPort: 9000
